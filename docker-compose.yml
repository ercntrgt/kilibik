# Yerel geliştirme için Postgres + Redis.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kilibik
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    # Konum blob'ları yalnızca bellekte yaşar; diske yazma kapalı.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
volumes:
  pgdata:
